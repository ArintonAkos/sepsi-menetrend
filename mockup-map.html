<!doctype html>
<html lang="hu"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sepsi Menetrend — térképes mockup</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.js"></script>
<style>
:root{
  --paper:#FBFAF7; --surface:#F2F1EC; --sunk:#EAE8DF;
  --ink:#232E10; --ink-2:#3F4A2A; --panel:#2E3D14; --panel-2:#3C5019;
  --signal:#EFC913; --signal-ink:#232E10;
  --muted:#6A6A5C; --border:#E1DFD4; --hair:#D8D5C8;
  --map-bg:#F0EEE6; --map-net:#C6C3B2; --map-halo:#FBFAF7; --map-case:#FBFAF7;
  --shadow:0 1px 2px rgba(35,46,16,.06),0 8px 24px -12px rgba(35,46,16,.18);
  --field-label:#2E3D14;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#14180D; --surface:#1C2113; --sunk:#242A18;
    --ink:#EEEDE3; --ink-2:#C3C6B2; --panel:#31411A; --panel-2:#3F5322;
    --signal:#EFC913; --signal-ink:#1A1F0E;
    --muted:#9B9C88; --border:#2B3220; --hair:#333B26;
    --map-bg:#101408; --map-net:#39412A; --map-halo:#101408; --map-case:#AFB79B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
    --field-label:#EEEDE3;
  }
}
:root[data-theme="dark"]{
  --paper:#14180D; --surface:#1C2113; --sunk:#242A18;
  --ink:#EEEDE3; --ink-2:#C3C6B2; --panel:#31411A; --panel-2:#3F5322;
  --signal:#EFC913; --signal-ink:#1A1F0E;
  --muted:#9B9C88; --border:#2B3220; --hair:#333B26;
  --map-bg:#101408; --map-net:#39412A; --map-halo:#101408; --map-case:#AFB79B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
  --field-label:#EEEDE3;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.rounded{font-family:ui-rounded,"SF Pro Rounded","Varela Round","Trebuchet MS",system-ui,sans-serif}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px;border-radius:6px}

.app{display:grid;grid-template-columns:min(420px,38vw) 1fr;height:100vh;height:100dvh}
.rail{display:flex;flex-direction:column;min-height:0;background:var(--paper);
  border-right:1px solid var(--border);position:relative;z-index:2}

/* ---- brand ---- */



:root[data-theme="dark"] 
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) }






/* ---- search panel ---- */
.panel{background:var(--panel);padding:14px 18px 16px;position:relative}
.panel-q{margin:0 0 10px;color:#fff;font-weight:700;font-size:15px;
  font-family:ui-rounded,"SF Pro Rounded","Varela Round",system-ui,sans-serif}
.fields{display:flex;flex-direction:column;gap:6px;position:relative}
.field{display:flex;align-items:center;gap:10px;background:var(--paper);
  border-radius:999px;padding:11px 16px;border:2px solid transparent}
.field:focus-within{border-color:var(--signal)}
.field span{font-weight:700;font-size:13px;color:var(--field-label);flex:0 0 auto;min-width:52px}
.field input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:14px}
.field input::placeholder{color:var(--muted)}
.swap{position:absolute;right:-6px;top:50%;transform:translateY(-50%);
  width:34px;height:34px;border-radius:50%;background:var(--panel-2);color:#fff;
  display:grid;place-items:center;border:2px solid var(--panel);font-size:13px;z-index:3}
.swap:hover{background:var(--signal);color:var(--signal-ink)}
.locate{display:flex;align-items:center;gap:8px;margin-top:11px;color:var(--signal);
  font-weight:600;font-size:13px}
.locate svg{width:15px;height:15px}

/* ---- controls ---- */
.controls{padding:12px 18px 10px;border-bottom:1px solid var(--border);display:flex;
  flex-direction:column;gap:11px;background:var(--paper)}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--hair);border-radius:999px;padding:6px 13px;
  font-size:13px;font-weight:600;color:var(--ink);background:var(--surface);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip small{font-weight:400;opacity:.7}
.pref{display:flex;flex-direction:column;gap:5px}
.pref-row{display:flex;justify-content:space-between;font-size:11px;font-weight:600;
  letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:99px;
  background:linear-gradient(90deg,var(--signal),var(--hair));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;border-radius:50%;
  background:var(--paper);border:3px solid var(--panel);cursor:grab;box-shadow:var(--shadow)}
input[type=range]::-moz-range-thumb{width:19px;height:19px;border-radius:50%;
  background:var(--paper);border:3px solid var(--panel);cursor:grab}

/* ---- results ---- */
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.result{display:block;width:100%;text-align:left;padding:13px 18px 13px 15px;
  border-bottom:1px solid var(--border);border-left:3px solid transparent;position:relative}
.result:hover{background:var(--surface)}
.result[aria-current="true"]{border-left-color:var(--signal);background:var(--surface)}
.r-top{display:flex;align-items:flex-start;gap:12px}
.r-modes{display:flex;align-items:center;gap:5px;flex-wrap:wrap;flex:1;min-width:0}
.r-dur{text-align:right;flex:0 0 auto;font-family:ui-rounded,"SF Pro Rounded","Varela Round",system-ui,sans-serif}
.r-dur b{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.r-dur span{font-size:12px;color:var(--muted);margin-left:2px}
.r-bot{display:flex;align-items:center;gap:10px;margin-top:7px;font-size:13px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.r-bot b{color:var(--ink);font-weight:600}
.r-tags{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;letter-spacing:.02em;padding:3px 8px;border-radius:999px;
  background:var(--sunk);color:var(--ink-2)}
.tag.hi{background:var(--signal);color:var(--signal-ink)}
.dot{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.5;flex:0 0 auto}

/* line chips + walk */
.line{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;
  padding:0 7px;border-radius:7px;font-weight:800;font-size:13px;letter-spacing:-.01em;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
  font-family:ui-rounded,"SF Pro Rounded","Varela Round",system-ui,sans-serif}
.line.sm{min-width:22px;height:20px;font-size:12px;border-radius:6px}
.walkicon{display:inline-flex;align-items:center;gap:1px;color:var(--ink-2);font-size:12px;font-weight:700}
.walkicon svg{width:15px;height:17px}

/* ---- detail ---- */
.dhead{display:flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink);
  padding:11px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:4}
.dhead b{font-family:ui-rounded,"SF Pro Rounded","Varela Round",system-ui,sans-serif;font-size:16px}
.dsum{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--surface);
  border-bottom:1px solid var(--border)}
.dsum .r-dur b{font-size:24px}
.tl{padding:6px 18px 18px}
.node{display:grid;grid-template-columns:26px 1fr auto;gap:0 12px;align-items:stretch;position:relative}
.rail-c{position:relative;display:flex;justify-content:center;align-items:flex-start;padding-top:4px}
.rail-c::before{content:"";position:absolute;top:0;bottom:0;width:4px;border-radius:2px;
  background:var(--bar,transparent)}
.node.walk .rail-c::before{background:none;
  background-image:linear-gradient(var(--ink-2) 55%,transparent 0);
  background-size:4px 10px;background-repeat:repeat-y;opacity:.5;width:4px}
.pip{width:13px;height:13px;border-radius:50%;background:var(--paper);
  border:3.5px solid var(--pip,var(--ink));position:relative;z-index:2;margin-top:3px}
.pip.flag{background:var(--ink);border-color:var(--ink)}
.n-body{padding-bottom:16px;min-width:0}
.n-name{font-weight:700;font-size:15px;letter-spacing:-.01em}
.n-sub{font-size:13px;color:var(--muted);margin-top:2px}
.n-time{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;padding-top:1px;
  align-self:start}
.n-time.soft{color:var(--muted);font-weight:400}
.ride-head{display:flex;align-items:center;gap:8px;margin:2px 0 4px}
.between{margin-top:8px;border:1px solid var(--border);border-radius:11px;overflow:hidden;background:var(--surface)}
.between summary{cursor:pointer;list-style:none;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.between summary::-webkit-details-marker{display:none}
.between ol{margin:0;padding:2px 12px 10px 28px;font-size:13px;color:var(--muted);
  display:flex;flex-direction:column;gap:5px}
.between li::marker{color:var(--hair)}
.between b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.interp{font-size:11px;color:var(--muted);opacity:.8}
.walkbox{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);font-weight:600}
.walkbox svg{width:17px;height:19px;flex:0 0 auto}
.fare{margin:4px 18px 18px;padding:14px 16px;border:1px solid var(--border);border-radius:14px;
  background:var(--surface);display:flex;flex-direction:column;gap:8px}
.fare-row{display:flex;justify-content:space-between;align-items:baseline}
.fare-row b{font-size:19px;font-family:ui-rounded,"SF Pro Rounded","Varela Round",system-ui,sans-serif}
.fare small{color:var(--muted);font-size:12px;line-height:1.45}
.cta{display:block;width:100%;background:var(--signal);color:var(--signal-ink);font-weight:800;
  padding:13px;border-radius:999px;text-align:center;font-size:15px;
  font-family:ui-rounded,"SF Pro Rounded","Varela Round",system-ui,sans-serif}

.disclaim{padding:11px 18px;border-top:1px solid var(--border);font-size:11px;line-height:1.5;
  color:var(--muted);background:var(--surface)}

/* ---- map ---- */
.map{position:relative;background:var(--map-bg);min-height:0}

.mapnote{position:absolute;left:14px;bottom:12px;font-size:11px;color:var(--muted);
  background:color-mix(in srgb,var(--paper) 88%,transparent);padding:5px 10px;border-radius:8px;
  border:1px solid var(--border);max-width:min(320px,60%);line-height:1.45}








/* ---- suggestions ---- */
.sugg{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--paper);
  border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden;z-index:9}
.sugg button{display:flex;width:100%;gap:11px;align-items:center;padding:10px 15px;text-align:left}
.sugg button:hover{background:var(--surface)}
.sugg button+button{border-top:1px solid var(--border)}
.sg-ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;
  background:var(--sunk);font-size:13px}
.sg-t{flex:1;min-width:0}
.sg-n{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg-s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg-alias{font-size:11px;font-weight:700;color:var(--panel);background:var(--signal);
  border-radius:5px;padding:1px 5px;flex:0 0 auto}

@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:36vh 1fr}
  .map{order:-1;border-bottom:1px solid var(--border)}
  .rail{border-right:0;border-radius:18px 18px 0 0;margin-top:-18px;box-shadow:0 -6px 24px -10px rgba(35,46,16,.28)}
  
  .mapnote{display:none}
  
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- mapbox ---- */
#mb{position:absolute;inset:0}
.mapboxgl-canvas{outline:none}
.mapboxgl-ctrl-bottom-right .mapboxgl-ctrl{margin:0 8px 8px 0}
.mapboxgl-ctrl-attrib{font-size:10px;background:color-mix(in srgb,var(--paper) 88%,transparent)!important}
.mapboxgl-ctrl-attrib a{color:var(--muted)!important}
.mapboxgl-ctrl-group{background:var(--paper)!important;border:1px solid var(--border);box-shadow:var(--shadow)!important}
.mapboxgl-ctrl-group button+button{border-top:1px solid var(--border)}
.mapboxgl-ctrl-bottom-left,.mapboxgl-ctrl-bottom-right{transition:transform .18s ease}
:root[data-theme="dark"] .mapboxgl-ctrl-icon{filter:invert(1) hue-rotate(180deg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mapboxgl-ctrl-icon{filter:invert(1) hue-rotate(180deg)}}

/* ---- pin button, sitting over the field but outside its click target ---- */
.field{padding-right:70px}
.pinbtn{position:absolute;right:36px;top:9px;width:30px;height:30px;border-radius:9px;
  display:grid;place-items:center;color:var(--field-label);background:var(--sunk);z-index:4}
.pinbtn.low{top:63px}
.pinbtn svg{width:17px;height:17px}
.pinbtn:hover{background:var(--signal);color:var(--signal-ink)}

/* ---- picking mode ---- */
.crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);
  pointer-events:none;z-index:5;display:grid;justify-items:center}
.crosshair svg{width:40px;height:52px;fill:var(--panel);stroke:var(--paper);stroke-width:2.5;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
.crosshair svg circle{fill:var(--signal);stroke:none}
.crosshair i{width:7px;height:7px;border-radius:50%;background:var(--panel);
  outline:2px solid var(--paper);margin-top:-4px}
.pinbar{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;width:min(560px,calc(100% - 28px));
  z-index:6;display:flex;align-items:center;gap:10px;background:var(--paper);
  border:1px solid var(--border);border-radius:16px;padding:10px 12px 10px 16px;box-shadow:var(--shadow)}
.pin-t{flex:1;min-width:0}
.pin-for{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.pin-label{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin-cancel{font-size:13px;font-weight:600;color:var(--muted);padding:8px 10px}
.pin-ok{background:var(--signal);color:var(--signal-ink);font-weight:800;font-size:14px;
  padding:9px 18px;border-radius:999px;
  font-family:ui-rounded,"SF Pro Rounded","Varela Round",system-ui,sans-serif}
body.picking .rail{display:none}
body.picking .app{grid-template-columns:1fr;grid-template-rows:1fr}
body.picking .map{order:0}
body.picking .mapnote{display:none}
body.picking .mapboxgl-ctrl-bottom-left,
body.picking .mapboxgl-ctrl-bottom-right{transform:translateY(-62px)}

/* ---- settings ---- */
.topright{position:absolute;right:14px;top:14px;z-index:7;display:grid;justify-items:end;gap:8px}
.gear{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:var(--paper);border:1px solid var(--border);box-shadow:var(--shadow);color:var(--ink)}
.gear svg{width:19px;height:19px}
.gear[aria-expanded="true"]{background:var(--ink);color:var(--paper)}
.settings{background:var(--paper);border:1px solid var(--border);border-radius:16px;
  box-shadow:var(--shadow);padding:14px;width:270px;display:grid;gap:12px}
.set-row{display:grid;gap:6px}
.set-row>span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;background:var(--sunk);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;font-size:13px;font-weight:600;padding:7px 4px;border-radius:9px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.set-note{margin:0;font-size:11px;line-height:1.5;color:var(--muted)}

/* ---- chip popovers ---- */
.controls{position:relative}
.pop{position:absolute;left:18px;right:18px;top:calc(100% - 4px);z-index:8;background:var(--paper);
  border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:12px;display:grid;gap:10px}
.pop-modes{display:grid;gap:4px}
.pop-mode{text-align:left;font-size:14px;font-weight:600;padding:9px 12px;border-radius:10px;color:var(--ink)}
.pop-mode:hover{background:var(--surface)}
.pop-mode[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.pop-time{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--surface);border-radius:11px;padding:9px 12px}
.pop-time span{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.pop-time input{border:0;background:none;font-size:16px;font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums}
.pop-note{margin:0;font-size:12px;color:var(--muted)}
.pop-lines{display:flex;flex-wrap:wrap;gap:6px}
.pop-line{padding:3px;border-radius:9px;opacity:.32;filter:grayscale(1)}
.pop-line[aria-pressed="true"]{opacity:1;filter:none}
.pop-actions{display:flex;gap:8px}
.pop-actions button{flex:1;font-size:13px;font-weight:600;padding:8px;border-radius:10px;
  background:var(--surface);color:var(--ink)}
.pop-actions button:hover{background:var(--sunk)}
.empty{padding:26px 18px;color:var(--muted);font-size:14px;text-align:center}
.sg-empty{padding:12px 15px;font-size:13px;color:var(--muted)}

@media (max-width:860px){
  .topright{right:10px;top:10px}
  .settings{width:min(270px,calc(100vw - 24px))}
}
</style>
</head><body>
<div class="app">
  <aside class="rail">
    <div class="panel">
      <p class="panel-q" id="q">Hová mész?</p>
      <div class="fields">
        <label class="field" for="i-from"><span id="l-from">Honnan</span>
          <input id="i-from" autocomplete="off" placeholder="megálló, cím, üzlet…"></label>
        <button class="pinbtn" data-for="from" title="Kijelölés a térképen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
        </button>
        <label class="field" for="i-to"><span id="l-to">Hová</span>
          <input id="i-to" autocomplete="off" placeholder="megálló, cím, üzlet…"></label>
        <button class="pinbtn low" data-for="to" title="Kijelölés a térképen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
        </button>
        <button class="swap" id="swap" title="csere">⇅</button>
        <div class="sugg" id="sugg" hidden></div>
      </div>
      <button class="locate" id="loc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="12" cy="12" r="3.4"/><path d="M12 2v3.2M12 18.8V22M2 12h3.2M18.8 12H22" stroke-linecap="round"/>
        </svg><span id="l-loc">A helyzetem</span>
      </button>
    </div>

    <div class="controls" id="controls">
      <div class="chips">
        <button class="chip" id="c-when" aria-expanded="false">Indulás <small>08:30</small></button>
        <button class="chip" id="c-day"  aria-expanded="false">Ma, szerda</button>
        <button class="chip" id="c-lines" aria-expanded="false">Vonalak</button>
      </div>
      <div class="pref">
        <div class="pref-row"><span id="p-a">Gyorsabb</span><span id="p-b">Kevesebb gyaloglás</span></div>
        <input type="range" id="pref" min="0" max="100" value="35" aria-label="preferencia">
      </div>
      <div class="pop" id="pop" hidden></div>
    </div>

    <div class="scroll" id="scroll">
      <div id="list"></div>
      <div id="detail" hidden></div>
    </div>
    <footer class="disclaim" id="disc"></footer>
  </aside>

  <main class="map">
    <div id="mb"></div>
    <div class="crosshair" id="cross" hidden>
      <svg viewBox="0 0 40 52" aria-hidden="true">
        <path d="M20 50c0-8 12-16 12-28a12 12 0 1 0-24 0c0 12 12 20 12 28z"/>
        <circle cx="20" cy="21" r="4.6"/></svg>
      <i></i>

const service = () => [0,6].includes(state.date.getDay()) ? "weekend" : "weekday";
const pat = l => D.patterns[l.pat];
function rideStops(l){                       // pattern + boarding time -> real stop times
  const p = pat(l), [h,m] = l.t0.split(":").map(Number), base = h*60 + m;
  return p.stops.map(s => ({ ...s, t: hhmm(base + s.o) }));
}
const linesOf = j => j.legs.filter(l => l.k === "ride").map(l => pat(l).line);
function results(){
  const pool = D.journeys[service()].filter(j => linesOf(j).every(x => state.lines.has(x)));
  const W = 0.3 + state.pref * 2.2, T0 = state.when;
  let cand;
  if (state.mode === "depart") cand = pool.filter(j => j.m0 >= T0)
      .map(j => ({ j, c: (j.m1 - T0) + j.walkMin * W }));
  else cand = pool.filter(j => j.m1 <= T0)
      .map(j => ({ j, c: (T0 - j.m0) + j.walkMin * W }));
  if (state.mode === "latest") cand.sort((a,b) => b.j.m0 - a.j.m0 || a.c - b.c);
  else cand.sort((a,b) => a.c - b.c || a.j.total - b.j.total);
  return cand.slice(0, 8).map(x => x.j);
}

/* ---------- fuzzy local search ---------- */
const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[^a-z0-9]+/g," ").trim().split(" ").filter(Boolean);
function dl(a,b){
  const m=a.length,n=b.length;
  if (Math.abs(m-n) > 2) return 3;
  const d=[]; for(let i=0;i<=m;i++) d[i]=[i];
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    const c = a[i-1]===b[j-1] ? 0 : 1;
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+c);
    if (i>1 && j>1 && a[i-1]===b[j-2] && a[i-2]===b[j-1])
      d[i][j] = Math.min(d[i][j], d[i-2][j-2]+1);   // saves Center/Centre
  }
  return d[m][n];
}
IDX.items.forEach(it => { it._tok = [...norm(it.ro), ...norm(it.hu), ...(it.alias||[]).flatMap(norm)]; });
const KINDW = { stop:-0.6, place:-0.2, shop:0, poi:0, street:0.35 };
function localSearch(query, limit = 7){
  const qt = norm(query);
  if (!qt.length) return [];
  return IDX.items.map(it => {
    let total = 0;
    for (const q of qt){
      let best = 9;
      for (const w of it._tok){
        if (w === q){ best = 0; break; }
        if (w.startsWith(q)){ best = Math.min(best, q.length >= 3 ? 0.2 : 0.6); continue; }
        if (q.length >= 4){
          const dd = dl(q, w);
          if (dd <= 1) best = Math.min(best, 1);
          else if (dd === 2 && q.length >= 6) best = Math.min(best, 2);
        }
      }
      if (best === 9) return null;
      total += best;
    }
    return { it, s: total + (KINDW[it.k] ?? 0) };
  }).filter(r => r && r.s < 3).sort((a,b) => a.s - b.s).slice(0, limit).map(r => r.it);
}
async function geocodeForward(query){
  /* Mapbox resolves house numbers OSM lacks: "Stadion utca 41" lands on the building.
     bbox is a HARD filter - without it that query matches Miskolc, 400 km away. */
  const u = new URL("https://api.mapbox.com/search/geocode/v6/forward");
  u.search = new URLSearchParams({ q: query, bbox: BBOX.join(","), limit: "4",
    language: state.lang === "hu" ? "hu" : "ro", access_token: TOKEN });
  try {
    const r = await fetch(u); if (!r.ok) return [];
    return (await r.json()).features.map(f => {
      const p = f.properties || {};
      return { k: p.feature_type === "street" ? "street" : "addr", ro: p.name, hu: p.name,
               sub: p.place_formatted || "", c: f.geometry.coordinates,
               remote: true, partial: p.feature_type === "street" };
    });
  } catch { return []; }
}
async function mapboxReverse(lon, lat){
  const u = `https://api.mapbox.com/search/geocode/v6/reverse?longitude=${lon}&latitude=${lat}`
          + `&types=address,street,place&limit=1&language=ro&access_token=${TOKEN}`;
  try {
    const r = await fetch(u); if (!r.ok) return null;
    const f = (await r.json()).features?.[0]; if (!f) return null;
    const p = f.properties || {};
    return { name: p.name || p.full_address, sub: p.place_formatted || "", type: p.feature_type };
  } catch { return null; }
}
const metres = (a,b) => {
  const k = Math.cos(45.865*Math.PI/180);
  return Math.hypot((a[0]-b[0])*k*111320, (a[1]-b[1])*111320);
};
function localReverse(lon, lat){
  let best = null, bd = 1e9;
  for (const it of IDX.items){
    if (it.k === "street") continue;            // centroid only, unreliable for reverse
    const d = metres(it.c, [lon, lat]);
    if (d < bd){ bd = d; best = it; }
  }
  return bd <= 60 ? { it: best, d: Math.round(bd) } : null;
}
const fmtCoord = (lon,lat) => `${lat.toFixed(5).replace(".",",")} · ${lon.toFixed(5).replace(".",",")}`;

/* ---------- map ---------- */
mapboxgl.accessToken = TOKEN;
const STYLES = { light:"mapbox://styles/mapbox/streets-v12", dark:"mapbox://styles/mapbox/dark-v11" };
const isDark = () => state.theme === "dark" ||
  (state.theme === "auto" && matchMedia("(prefers-color-scheme:dark)").matches);
const map = new mapboxgl.Map({
  container:"mb", style: STYLES[isDark() ? "dark" : "light"], center: CENTRE, zoom: 12.4,
  maxBounds: [[BBOX[0]-0.06, BBOX[1]-0.05],[BBOX[2]+0.06, BBOX[3]+0.05]]
});
map.addControl(new mapboxgl.NavigationControl({ showCompass:false }), "bottom-right");
const fc = f => ({ type:"FeatureCollection", features:f });
const lineFeat = (c,p) => ({ type:"Feature", properties:p, geometry:{ type:"LineString", coordinates:c }});
const ptFeat   = (c,p) => ({ type:"Feature", properties:p, geometry:{ type:"Point", coordinates:c }});

/* routes belong above every fill and line of the basemap but below its labels,
   or the white street casings paint straight over them */
function labelAnchor(){
  const ls = map.getStyle().layers;
  for (let i = ls.length - 1; i >= 0; i--) if (ls[i].type !== "symbol") return ls[i+1]?.id;
}
function buildLayers(){
  const before = labelAnchor();
  map.addSource("net", { type:"geojson", data: fc(
    Object.entries(D.net).map(([id,c]) => lineFeat(c, { line: D.routeOf[id] })) )});
  ["trip","nodes","ends"].forEach(s => map.addSource(s, { type:"geojson", data: fc([]) }));
  map.addLayer({ id:"net-line", type:"line", source:"net",
    paint:{ "line-color": isDark() ? "#4A5340" : "#B9B6A6", "line-width":1.6, "line-opacity":.75 },
    layout:{ "line-cap":"round","line-join":"round" } }, before);
  map.addLayer({ id:"trip-case", type:"line", source:"trip", filter:["==",["get","kind"],"ride"],
    paint:{ "line-color": isDark() ? "#0D1108" : "#FFFFFF", "line-width":11 },
    layout:{ "line-cap":"round","line-join":"round" } }, before);
  map.addLayer({ id:"trip-line", type:"line", source:"trip", filter:["==",["get","kind"],"ride"],
    paint:{ "line-color":["get","color"], "line-width":6 },
    layout:{ "line-cap":"round","line-join":"round" } }, before);
  map.addLayer({ id:"trip-walk", type:"line", source:"trip", filter:["==",["get","kind"],"walk"],
    paint:{ "line-color": isDark() ? "#E7E6DA" : "#232E10", "line-width":3.4,
            "line-dasharray":[0.2,1.9] }, layout:{ "line-cap":"round" } }, before);
  map.addLayer({ id:"trip-nodes", type:"circle", source:"nodes",
    paint:{ "circle-radius":4.6, "circle-color": isDark() ? "#0D1108" : "#FFFFFF",
            "circle-stroke-color":["get","color"], "circle-stroke-width":2.6 } }, before);
  map.addLayer({ id:"trip-ends", type:"circle", source:"ends",
    paint:{ "circle-radius":7.5, "circle-color":["get","color"],
            "circle-stroke-color": isDark() ? "#0D1108" : "#FFFFFF", "circle-stroke-width":3 } }, before);
  applyLineFilter();
}
function applyLineFilter(){
  if (!map.getLayer("net-line")) return;
  map.setFilter("net-line", ["in", ["get","line"], ["literal", [...state.lines]]]);
}
function drawTrip(j, fit = true){
  if (!mapReady || !j) return;
  const feats = [], nodes = [], ends = [];
  j.legs.forEach(l => {
    if (l.k === "ride"){
      const p = pat(l);
      feats.push(lineFeat(p.path, { kind:"ride", color: chipColor(p.line) }));
      p.stops.slice(1,-1).forEach(s => nodes.push(ptFeat(s.c, { color: chipColor(p.line) })));
    } else if (l.m > 0) feats.push(lineFeat(l.path, { kind:"walk" }));
  });
  const rides = j.legs.filter(l => l.k === "ride");
  ends.push(ptFeat(pat(rides[0]).stops[0].c, { color: chipColor(pat(rides[0]).line) }));
  const lastP = pat(rides[rides.length-1]);
  ends.push(ptFeat(lastP.stops[lastP.stops.length-1].c, { color:"#232E10" }));
  map.getSource("trip").setData(fc(feats));
  map.getSource("nodes").setData(fc(nodes));
  map.getSource("ends").setData(fc(ends));
  if (!fit) return;
  const pts = j.legs.flatMap(l => l.k === "ride" ? pat(l).path : (l.m > 0 ? l.path : []));
  const b = pts.reduce((a,p) => a.extend(p), new mapboxgl.LngLatBounds(pts[0], pts[0]));
  const narrow = innerWidth <= 860;
  map.fitBounds(b, { padding: narrow ? {top:60,bottom:40,left:30,right:30}
                                     : {top:70,bottom:90,left:70,right:70}, duration:600 });
}
map.on("load", () => { mapReady = true; buildLayers(); redraw(); });

/* ---------- results ---------- */
let shown = [];
function drawList(){
  shown = results();
  const box = document.getElementById("list");
  if (!shown.length){ box.innerHTML = `<p class="empty">${t("noresult")}</p>`; return; }
  const fastest = shown.reduce((a,b) => b.total < a.total ? b : a);
  const least   = shown.reduce((a,b) => b.walkMin < a.walkMin ? b : a);
  box.innerHTML = shown.map((j,i) => {
    const rides = j.legs.filter(l => l.k === "ride");
    const modes = j.legs.filter(l => l.k === "ride" || l.m > 0)
      .map(l => l.k === "ride" ? lineChip(pat(l).line) : walkTag(l.min))
      .join('<span class="dot"></span>');
    const tags = [];
    if (j === fastest) tags.push(`<span class="tag hi">${t("fastest")}</span>`);
    if (j === least && j !== fastest) tags.push(`<span class="tag">${t("least")}</span>`);
    tags.push(`<span class="tag">${rides.length > 1 ? (rides.length-1)+" "+t("change") : t("direct")}</span>`);
    return `<button class="result" data-i="${i}" aria-current="${i===state.chosen}">
      <div class="r-top"><div class="r-modes">${modes}</div>
        <div class="r-dur"><b>${j.total}</b><span>${t("min")}</span></div></div>
      <div class="r-bot"><b>${j.dep} → ${j.arr}</b><span class="dot"></span>
        <span>${j.tickets} × ${money(j.price)} lej</span></div>
      <div class="r-tags">${tags.join("")}</div></button>`;
  }).join("");
  box.querySelectorAll(".result").forEach(b => {
    b.onclick = () => openDetail(+b.dataset.i);
    b.onmouseenter = () => drawTrip(shown[+b.dataset.i], false);
  });
}
function nodeRow({pip,bar,name,sub,time,flag,soft}){
  return `<div class="node" style="--bar:${bar}">
    <div class="rail-c"><span class="pip${flag?" flag":""}" style="--pip:${pip}"></span></div>
    <div class="n-body"><div class="n-name">${name}</div>${sub?`<div class="n-sub">${sub}</div>`:""}</div>
    <div class="n-time${soft?" soft":""}">${time}${soft?"*":""}</div></div>`;
}
function openDetail(i){
  state.chosen = i;
  const j = shown[i]; if (!j) return;
  const el = document.getElementById("detail");
  const firstP = pat(j.legs.find(l => l.k === "ride"));
  let html = `<div class="dhead"><button id="back" aria-label="${t("back")}"
      style="font-size:22px;line-height:1;width:26px">‹</button><b>${t("trip")}</b></div>
    <div class="dsum"><div class="r-modes">${j.legs.filter(l=>l.k==="ride"||l.m>0)
      .map(l => l.k==="ride" ? lineChip(pat(l).line) : walkTag(l.min)).join('<span class="dot"></span>')}</div>
      <div class="r-dur"><b>${j.total}</b><span>${t("min")}</span></div></div><div class="tl">`;
  html += nodeRow({ pip: chipColor(firstP.line), bar: chipColor(firstP.line),
                    name: nm(D.from), sub: t("dep"), time: j.dep });
  j.legs.forEach((l,k) => {
    if (l.k === "ride"){
      const p = pat(l), ss = rideStops(l), col = chipColor(p.line);
      const mid = ss.slice(1,-1), end = ss[ss.length-1];
      let body = `<div class="ride-head">${lineChip(p.line,true)}
        <span class="n-sub" style="margin:0">→ ${nm(p.head)}</span></div>`;
      if (mid.length) body += `<details class="between"><summary>${mid.length} ${t("stops")} ⌄</summary>
        <ol>${mid.map(s => `<li>${nm({hu:s.h,ro:s.n})} <b>${s.t}${s.tp?"":"*"}</b></li>`).join("")}</ol></details>`;
      html += `<div class="node" style="--bar:${col}"><div class="rail-c">
          <span class="pip" style="--pip:${col}"></span></div>
        <div class="n-body">${body}</div><div class="n-time"></div></div>`;
      if (j.legs[k+1]) html += nodeRow({ pip:col, bar:"transparent",
        name: nm({hu:end.h, ro:end.n}), sub:"", time:end.t, soft:!end.tp });
    } else {
      const same = l.m === 0;
      html += `<div class="node walk"><div class="rail-c"><span class="pip"
          style="--pip:var(--ink-2);width:9px;height:9px;border-width:2.5px"></span></div>
        <div class="n-body"><div class="walkbox">${same ? "" : WALKSVG}
          <span>${same ? t("samestop") : `${l.m} m · ${l.min} ${t("min")} ${t("walkm")}`}</span></div>
          <div class="n-sub">${nm(l.to)}${j.wait ? ` · ${j.wait} ${t("min")} ${t("wait")}` : ""}</div>
        </div><div class="n-time soft"></div></div>`;
    }
  });
  const lastRide = j.legs.filter(l => l.k === "ride").pop();
  const fin = rideStops(lastRide).pop();
  html += nodeRow({ pip:"var(--ink)", bar:"transparent", name:nm(D.to), sub:t("arr"),
                    time:j.arr, flag:true, soft:!fin.tp });
  html += `</div><div class="fare">
      <div class="fare-row"><span>${t("ticket")}</span><b>${j.tickets} × ${money(j.price)} lej</b></div>
      <small>${t("fare")}</small><button class="cta">${t("buy")}</button></div>`;
  el.innerHTML = html; el.hidden = false;
  document.getElementById("list").hidden = true;
  document.getElementById("controls").style.display = "none";
  document.getElementById("back").onclick = closeDetail;
  document.getElementById("scroll").scrollTop = 0;
  drawTrip(j);
}
function closeDetail(){
  document.getElementById("detail").hidden = true;
  document.getElementById("list").hidden = false;
  document.getElementById("controls").style.display = "";
  redraw();
}
function redraw(){ drawList(); drawTrip(shown[state.chosen] || shown[0]); }

/* ---------- chip popovers ---------- */
const pop = document.getElementById("pop");
let popOwner = null;
function closePop(){
  pop.hidden = true; pop.innerHTML = "";
  if (popOwner) popOwner.setAttribute("aria-expanded","false");
  popOwner = null;
}
function openPop(btn, html, wire){
  if (popOwner === btn){ closePop(); return; }
  closePop();
  popOwner = btn; btn.setAttribute("aria-expanded","true");
  pop.innerHTML = html; pop.hidden = false;
  wire && wire(pop);
}
document.addEventListener("click", e => {
  if (popOwner && !pop.contains(e.target) && !popOwner.contains(e.target)) closePop();
  const st = document.getElementById("settings"), g = document.getElementById("gear");
  if (!st.hidden && !st.contains(e.target) && !g.contains(e.target)) toggleSettings(false);
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (pinFor) endPin(); else if (popOwner) closePop();
  else if (!document.getElementById("settings").hidden) toggleSettings(false);
});

const whenBtn  = document.getElementById("c-when");
const dayBtn   = document.getElementById("c-day");
const lineBtn  = document.getElementById("c-lines");

const whenHTML = () => `
  <div class="pop-modes">
    ${["depart","arrive","latest"].map(m =>
      `<button class="pop-mode" data-m="${m}" aria-pressed="${state.mode===m}">${t(m+"L")}</button>`).join("")}
  </div>
  <label class="pop-time"><span>${t(state.mode === "depart" ? "depart" : "arrive")}</span>
    <input type="time" id="p-time" value="${hhmm(state.when)}" step="300"></label>`;
function wireWhen(el){
  el.querySelectorAll(".pop-mode").forEach(b => b.onclick = ev => {
    ev.stopPropagation();                 // keep the popover open, just re-render it
    state.mode = b.dataset.m; state.chosen = 0;
    el.innerHTML = whenHTML(); wireWhen(el);
    syncChips(); redraw();
  });
  el.querySelector("#p-time").onchange = e => {

    state.when = h*60 + m; state.chosen = 0; syncChips(); redraw();

}
whenBtn.onclick = () => openPop(whenBtn, whenHTML(), wireWhen);

dayBtn.onclick = () => {
  const iso = new Date(state.date.getTime() - state.date.getTimezoneOffset()*6e4)
    .toISOString().slice(0,10);
  openPop(dayBtn, `<label class="pop-time"><span>${t("today")}</span>
      <input type="date" id="p-date" value="${iso}"></label>
    <p class="pop-note">${service()==="weekend" ? t("weekend") : t("weekday")} · ${t("days")[state.date.getDay()]}</p>`,
    el => el.querySelector("#p-date").onchange = e => {
      const [y,m,d] = e.target.value.split("-").map(Number);

    });
};

lineBtn.onclick = () => openPop(lineBtn, `
  <div class="pop-lines">${D.lines.map(id => `
    <button class="pop-line" data-l="${id}" aria-pressed="${state.lines.has(id)}">
      ${lineChip(id,true)}</button>`).join("")}</div>
  <div class="pop-actions"><button data-all="1">${t("allLines")}</button>

    el.querySelectorAll(".pop-line").forEach(b => b.onclick = ev => {

/* ---------- suggestions ---------- */
const ICON = { street:"⌁", stop:"⬤", shop:"◧", poi:"◎", place:"▣", addr:"⌖" };
async function suggest(which){
  const inp = document.getElementById("i-"+which), box = document.getElementById("sugg");
  const v = inp.value.trim();
  if (v.length < 2){ box.hidden = true; return; }
  const mine = ++seq;
  let hits = localSearch(v);
  render(hits);
  if (hits.length < 3){
    const remote = await geocodeForward(v);
    if (mine !== seq) return;
    const have = new Set(hits.map(h => label(h).toLowerCase()));
    render(hits.concat(remote.filter(r => r.ro && !have.has(label(r).toLowerCase()))));
  }
  function render(items){
    box.innerHTML = items.length ? items.map(it => {
      const alias = (it.alias||[]).find(a => norm(v).some(q => norm(a).some(w => w.startsWith(q))));
      const sub = [it.sub || other(it) || t("kinds")[it.k],
                   it.remote ? t("src_mapbox") : null,
                   it.partial ? t("nostreet") : null].filter(Boolean).join(" · ");
      return `<button data-lon="${it.c[0]}" data-lat="${it.c[1]}"
        data-name="${label(it).replace(/"/g,"&quot;")}">
        <span class="sg-ic">${ICON[it.k]||"◎"}</span>
        <span class="sg-t"><span class="sg-n">${label(it)}</span><span class="sg-s">${sub}</span></span>
        ${alias ? `<span class="sg-alias">${alias}</span>` : ""}</button>`;
    }).join("") : `<div class="sg-empty">${t("noaddr")}</div>`;
    box.hidden = false;
    box.querySelectorAll("button").forEach(b => b.onmousedown = e => {
      e.preventDefault();
      setEndpoint(which, { name: b.dataset.name, c: [+b.dataset.lon, +b.dataset.lat] });
      box.hidden = true;
    });
  }
}
function setEndpoint(which, place){
  endpoint[which] = place;
  document.getElementById("i-"+which).value = place.name;
}
["from","to"].forEach(id => {
  const inp = document.getElementById("i-"+id); let tmr;
  inp.addEventListener("input", () => { clearTimeout(tmr); tmr = setTimeout(() => suggest(id), 220); });
  inp.addEventListener("focus", () => suggest(id));
  inp.addEventListener("blur",  () => setTimeout(() => document.getElementById("sugg").hidden = true, 150));
});
document.getElementById("swap").onclick = () => {
  const a = document.getElementById("i-from"), b = document.getElementById("i-to");
  [a.value, b.value] = [b.value, a.value];
  [endpoint.from, endpoint.to] = [endpoint.to, endpoint.from];
};

/* ---------- pin picker ---------- */
document.querySelectorAll(".pinbtn").forEach(b => b.addEventListener("click", e => {
  e.preventDefault(); e.stopPropagation(); startPin(b.dataset.for);
}));
function startPin(which){
  closePop(); toggleSettings(false);
  document.getElementById("sugg").hidden = true;
  document.activeElement?.blur?.();
  document.querySelector(".rail").style.display = "none";   // not left to a CSS class
  pinFor = which;
  document.body.classList.add("picking");
  document.getElementById("pin-for").textContent = t(which);
  document.getElementById("cross").hidden = false;
  document.getElementById("pinbar").hidden = false;
  requestAnimationFrame(() => map.resize());
  resolvePin();
}
function endPin(){
  pinFor = null; pinPlace = null;
  document.querySelector(".rail").style.display = "";
  document.body.classList.remove("picking");
  document.getElementById("cross").hidden = true;
  document.getElementById("pinbar").hidden = true;
  requestAnimationFrame(() => map.resize());
}
map.on("move", () => { if (pinFor){ clearTimeout(pinTimer); pinTimer = setTimeout(resolvePin, 260); } });
async function resolvePin(){
  if (!pinFor) return;
  const { lng: lon, lat } = map.getCenter();
  const lab = document.getElementById("pin-label"), sub = document.getElementById("pin-sub");
  if (lon < BBOX[0] || lon > BBOX[2] || lat < BBOX[1] || lat > BBOX[3]){
    lab.textContent = fmtCoord(lon, lat); sub.textContent = t("far");
    pinPlace = { name: fmtCoord(lon, lat), c:[lon,lat] }; return;
  }
  const near = localReverse(lon, lat);                 // 1. named thing within 60 m
  if (near){
    lab.textContent = label(near.it);
    sub.textContent = `${near.d} m · ${t("src_local")}`;
    pinPlace = { name: label(near.it), c:[lon,lat] }; return;
  }
  lab.textContent = t("resolving"); sub.textContent = "";
  const mine = ++seq;
  const r = await mapboxReverse(lon, lat);             // 2. Mapbox, live, never stored
  if (mine !== seq || !pinFor) return;
  if (r && r.name){
    lab.textContent = r.name;
    sub.textContent = (r.sub || t("src_mapbox")) + (r.type === "street" ? ` · ${t("nostreet")}` : "");
    pinPlace = { name: r.name, c:[lon,lat] };
  } else {                                             // 3. plain coordinates
    lab.textContent = fmtCoord(lon, lat); sub.textContent = t("src_coord");
    pinPlace = { name: fmtCoord(lon, lat), c:[lon,lat] };
  }
}
document.getElementById("pin-ok").onclick = () => {
  if (pinPlace && pinFor) setEndpoint(pinFor, pinPlace);
  endPin();
};
document.getElementById("pin-cancel").onclick = endPin;

/* ---------- language / boot ---------- */
document.getElementById("pref").oninput = e => { state.pref = e.target.value/100; state.chosen = 0; redraw(); };
function setLang(x){
  state.lang = x;
  document.getElementById("hu").setAttribute("aria-pressed", x === "hu");
  document.getElementById("ro").setAttribute("aria-pressed", x === "ro");
  document.documentElement.lang = x;
  const set = (id,v) => document.getElementById(id).textContent = v;
  set("q",t("q")); set("l-from",t("from")); set("l-to",t("to")); set("l-loc",t("loc"));
  set("p-a",t("fast")); set("p-b",t("walk")); set("note",t("note")); set("disc",t("disc"));
  set("pin-cancel",t("pinCancel")); set("pin-ok",t("pinOk"));
  set("s-lang",t("lang")); set("s-theme",t("theme")); set("s-note",t("setNote"));
  set("th-l",t("light")); set("th-d",t("dark")); set("th-a",t("auto"));
  document.getElementById("i-from").value = endpoint.from?.name ?? nm(D.from);
  document.getElementById("i-to").value   = endpoint.to?.name   ?? nm(D.to);
  ["from","to"].forEach(k => document.getElementById("i-"+k).placeholder =
    x === "hu" ? "megálló, cím, üzlet…" : "stație, adresă, magazin…");
  closePop(); syncChips();
  const open = !document.getElementById("detail").hidden;
  if (open) openDetail(state.chosen); else redraw();
}
const now = new Date();
state.when = Math.min(21*60+30, Math.max(5*60+30, now.getHours()*60 + now.getMinutes()));
setLang("hu");
setTheme("auto");

</script>
