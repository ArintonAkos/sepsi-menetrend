<title>Sepsi Menetrend</title>
<style>
:root{
  --paper:#FBFAF7; --surface:#F2F1EC; --sunk:#EAE8DF;
  --ink:#232E10; --ink-2:#3F4A2A; --panel:#2E3D14; --panel-2:#3C5019;
  --signal:#EFC913; --signal-ink:#232E10;
  --muted:#6A6A5C; --border:#E1DFD4; --hair:#D8D5C8;
  --map-bg:#F0EEE6; --map-net:#C6C3B2; --map-halo:#FBFAF7; --map-case:#FBFAF7;
  --shadow:0 1px 2px rgba(35,46,16,.06),0 8px 24px -12px rgba(35,46,16,.18);
  --field-label:#2E3D14;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#14180D; --surface:#1C2113; --sunk:#242A18;
    --ink:#EEEDE3; --ink-2:#C3C6B2; --panel:#31411A; --panel-2:#3F5322;
    --signal:#EFC913; --signal-ink:#1A1F0E;
    --muted:#9B9C88; --border:#2B3220; --hair:#333B26;
    --map-bg:#101408; --map-net:#39412A; --map-halo:#101408; --map-case:#AFB79B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
    --field-label:#EEEDE3;
  }
}
:root[data-theme="dark"]{
  --paper:#14180D; --surface:#1C2113; --sunk:#242A18;
  --ink:#EEEDE3; --ink-2:#C3C6B2; --panel:#31411A; --panel-2:#3F5322;
  --signal:#EFC913; --signal-ink:#1A1F0E;
  --muted:#9B9C88; --border:#2B3220; --hair:#333B26;
  --map-bg:#101408; --map-net:#39412A; --map-halo:#101408; --map-case:#AFB79B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
  --field-label:#EEEDE3;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.rounded{font-family:ui-rounded,"SF Pro Rounded","Varela Round","Trebuchet MS",system-ui,sans-serif}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px;border-radius:6px}

.app{display:grid;grid-template-columns:min(420px,38vw) 1fr;height:100vh;height:100dvh}
.rail{display:flex;flex-direction:column;min-height:0;background:var(--paper);
  border-right:1px solid var(--border);position:relative;z-index:2}

/* ---- brand ---- */
.brand{display:flex;align-items:center;gap:10px;padding:14px 18px 12px}
.wordmark{font-family:ui-rounded,"SF Pro Rounded","Varela Round",system-ui,sans-serif;
  font-weight:700;font-size:19px;letter-spacing:-.02em;color:var(--ink);display:flex;align-items:baseline;gap:2px}
.wordmark i{font-style:normal;color:var(--panel)}
:root[data-theme="dark"] .wordmark i{color:var(--signal)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wordmark i{color:var(--signal)}}
.unofficial{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--hair);border-radius:999px;padding:2px 7px;white-space:nowrap}
.brand-sp{flex:1}
.lang{display:flex;background:var(--sunk);border-radius:999px;padding:2px}
.lang button{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}

/* ---- search panel ---- */
.panel{background:var(--panel);padding:14px 18px 16px;position:relative}
.panel-q{margin:0 0 10px;color:#fff;font-weight:700;font-size:15px;
  font-family:ui-rounded,"SF Pro Rounded","Varela Round",system-ui,sans-serif}
.fields{display:flex;flex-direction:column;gap:6px;position:relative}
.field{display:flex;align-items:center;gap:10px;background:var(--paper);
  border-radius:999px;padding:11px 16px;border:2px solid transparent}
.field:focus-within{border-color:var(--signal)}
.field span{font-weight:700;font-size:13px;color:var(--field-label);flex:0 0 auto;min-width:52px}
.field input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:14px}
.field input::placeholder{color:var(--muted)}
.swap{position:absolute;right:-6px;top:50%;transform:translateY(-50%);
  width:34px;height:34px;border-radius:50%;background:var(--panel-2);color:#fff;
  display:grid;place-items:center;border:2px solid var(--panel);font-size:13px;z-index:3}
.swap:hover{background:var(--signal);color:var(--signal-ink)}
.locate{display:flex;align-items:center;gap:8px;margin-top:11px;color:var(--signal);
  font-weight:600;font-size:13px}
.locate svg{width:15px;height:15px}

/* ---- controls ---- */
.controls{padding:12px 18px 10px;border-bottom:1px solid var(--border);display:flex;
  flex-direction:column;gap:11px;background:var(--paper)}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--hair);border-radius:999px;padding:6px 13px;
  font-size:13px;font-weight:600;color:var(--ink);background:var(--surface);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip small{font-weight:400;opacity:.7}
.pref{display:flex;flex-direction:column;gap:5px}
.pref-row{display:flex;justify-content:space-between;font-size:11px;font-weight:600;
  letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:99px;
  background:linear-gradient(90deg,var(--signal),var(--hair));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:19px;height:19px;border-radius:50%;
  background:var(--paper);border:3px solid var(--panel);cursor:grab;box-shadow:var(--shadow)}
input[type=range]::-moz-range-thumb{width:19px;height:19px;border-radius:50%;
  background:var(--paper);border:3px solid var(--panel);cursor:grab}

/* ---- results ---- */
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.result{display:block;width:100%;text-align:left;padding:13px 18px 13px 15px;
  border-bottom:1px solid var(--border);border-left:3px solid transparent;position:relative}
.result:hover{background:var(--surface)}
.result[aria-current="true"]{border-left-color:var(--signal);background:var(--surface)}
.r-top{display:flex;align-items:flex-start;gap:12px}
.r-modes{display:flex;align-items:center;gap:5px;flex-wrap:wrap;flex:1;min-width:0}
.r-dur{text-align:right;flex:0 0 auto;font-family:ui-rounded,"SF Pro Rounded","Varela Round",system-ui,sans-serif}
.r-dur b{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.r-dur span{font-size:12px;color:var(--muted);margin-left:2px}
.r-bot{display:flex;align-items:center;gap:10px;margin-top:7px;font-size:13px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.r-bot b{color:var(--ink);font-weight:600}
.r-tags{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;letter-spacing:.02em;padding:3px 8px;border-radius:999px;
  background:var(--sunk);color:var(--ink-2)}
.tag.hi{background:var(--signal);color:var(--signal-ink)}
.dot{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.5;flex:0 0 auto}

/* line chips + walk */
.line{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;
  padding:0 7px;border-radius:7px;font-weight:800;font-size:13px;letter-spacing:-.01em;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
  font-family:ui-rounded,"SF Pro Rounded","Varela Round",system-ui,sans-serif}
.line.sm{min-width:22px;height:20px;font-size:12px;border-radius:6px}
.walkicon{display:inline-flex;align-items:center;gap:1px;color:var(--ink-2);font-size:12px;font-weight:700}
.walkicon svg{width:15px;height:17px}

/* ---- detail ---- */
.dhead{display:flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink);
  padding:11px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:4}
.dhead b{font-family:ui-rounded,"SF Pro Rounded","Varela Round",system-ui,sans-serif;font-size:16px}
.dsum{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--surface);
  border-bottom:1px solid var(--border)}
.dsum .r-dur b{font-size:24px}
.tl{padding:6px 18px 18px}
.node{display:grid;grid-template-columns:26px 1fr auto;gap:0 12px;align-items:stretch;position:relative}
.rail-c{position:relative;display:flex;justify-content:center;align-items:flex-start;padding-top:4px}
.rail-c::before{content:"";position:absolute;top:0;bottom:0;width:4px;border-radius:2px;
  background:var(--bar,transparent)}
.node.walk .rail-c::before{background:none;
  background-image:linear-gradient(var(--ink-2) 55%,transparent 0);
  background-size:4px 10px;background-repeat:repeat-y;opacity:.5;width:4px}
.pip{width:13px;height:13px;border-radius:50%;background:var(--paper);
  border:3.5px solid var(--pip,var(--ink));position:relative;z-index:2;margin-top:3px}
.pip.flag{background:var(--ink);border-color:var(--ink)}
.n-body{padding-bottom:16px;min-width:0}
.n-name{font-weight:700;font-size:15px;letter-spacing:-.01em}
.n-sub{font-size:13px;color:var(--muted);margin-top:2px}
.n-time{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;padding-top:1px;
  align-self:start}
.n-time.soft{color:var(--muted);font-weight:400}
.ride-head{display:flex;align-items:center;gap:8px;margin:2px 0 4px}
.between{margin-top:8px;border:1px solid var(--border);border-radius:11px;overflow:hidden;background:var(--surface)}
.between summary{cursor:pointer;list-style:none;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink-2)}
.between summary::-webkit-details-marker{display:none}
.between ol{margin:0;padding:2px 12px 10px 28px;font-size:13px;color:var(--muted);
  display:flex;flex-direction:column;gap:5px}
.between li::marker{color:var(--hair)}
.between b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.interp{font-size:11px;color:var(--muted);opacity:.8}
.walkbox{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);font-weight:600}
.walkbox svg{width:17px;height:19px;flex:0 0 auto}
.fare{margin:4px 18px 18px;padding:14px 16px;border:1px solid var(--border);border-radius:14px;
  background:var(--surface);display:flex;flex-direction:column;gap:8px}
.fare-row{display:flex;justify-content:space-between;align-items:baseline}
.fare-row b{font-size:19px;font-family:ui-rounded,"SF Pro Rounded","Varela Round",system-ui,sans-serif}
.fare small{color:var(--muted);font-size:12px;line-height:1.45}
.cta{display:block;width:100%;background:var(--signal);color:var(--signal-ink);font-weight:800;
  padding:13px;border-radius:999px;text-align:center;font-size:15px;
  font-family:ui-rounded,"SF Pro Rounded","Varela Round",system-ui,sans-serif}

.disclaim{padding:11px 18px;border-top:1px solid var(--border);font-size:11px;line-height:1.5;
  color:var(--muted);background:var(--surface)}

/* ---- map ---- */
.map{position:relative;background:var(--map-bg);min-height:0}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.mapnote{position:absolute;left:14px;bottom:12px;font-size:11px;color:var(--muted);
  background:color-mix(in srgb,var(--paper) 88%,transparent);padding:5px 10px;border-radius:8px;
  border:1px solid var(--border);max-width:min(320px,60%);line-height:1.45}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;
  border-radius:11px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border)}
.zoom button{width:36px;height:36px;background:var(--paper);font-size:17px;font-weight:600;color:var(--ink)}
.zoom button+button{border-top:1px solid var(--border)}
.theme{position:absolute;right:14px;top:14px;background:var(--paper);border:1px solid var(--border);
  border-radius:999px;padding:7px 13px;font-size:12px;font-weight:600;box-shadow:var(--shadow)}
#net path{fill:none;stroke:var(--map-net);stroke-linecap:round;stroke-linejoin:round}
#trip path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.stopdot{fill:var(--map-halo);stroke:var(--map-net)}

/* ---- suggestions ---- */
.sugg{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--paper);
  border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden;z-index:9}
.sugg button{display:flex;width:100%;gap:11px;align-items:center;padding:10px 15px;text-align:left}
.sugg button:hover{background:var(--surface)}
.sugg button+button{border-top:1px solid var(--border)}
.sg-ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;
  background:var(--sunk);font-size:13px}
.sg-t{flex:1;min-width:0}
.sg-n{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg-s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg-alias{font-size:11px;font-weight:700;color:var(--panel);background:var(--signal);
  border-radius:5px;padding:1px 5px;flex:0 0 auto}

@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:36vh 1fr}
  .map{order:-1;border-bottom:1px solid var(--border)}
  .rail{border-right:0;border-radius:18px 18px 0 0;margin-top:-18px;box-shadow:0 -6px 24px -10px rgba(35,46,16,.28)}
  .brand{padding-top:10px}
  .mapnote{display:none}
  .theme{top:10px;right:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
const D = JSON.parse(document.getElementById("data").textContent);
let L = "hu", pref = 0.35, chosen = 0, view = null;

const T = {
  hu:{q:"Hová mész?",from:"Honnan",to:"Hová",loc:"A helyzetem",fast:"Gyorsabb",
      walk:"Kevesebb gyaloglás",when:"Indulás",day:"Ma, szerda",lines:"Vonalak",
      min:"perc",change:"átszállás",direct:"közvetlen",wait:"várakozás",
      trip:"Az utad",stops:"megálló",back:"Vissza",walkm:"gyaloglás",
      fastest:"leggyorsabb",least:"legkevesebb gyaloglás",ticket:"Jegy",
      fare:"24pay jegy, 60 percig érvényes · árkosi viszonylat",
      buy:"Megnyitás a 24pay-ben",interp:"becsült idő",
      unoff:"nem hivatalos",dark:"Sötét",light:"Világos",
      note:"A 12 vonal valódi nyomvonala a GTFS shapes.txt-ből. Az útvonal a menetrendből számolva.",
      disc:"Tervezet · Nem a Multi-Trans SA hivatalos oldala. Az adatok a multitrans.ro-n közzétett menetrendből származnak. A csillaggal jelölt időpontok interpoláltak, nem hivatalosak.",
      dep:"indulás",arr:"érkezés",samestop:"Átszállás ugyanitt"},
  ro:{q:"Unde mergi?",from:"De la",to:"Spre",loc:"Locația mea",fast:"Mai rapid",
      walk:"Mai puțin mers pe jos",when:"Plecare",day:"Azi, miercuri",lines:"Linii",
      min:"min",change:"schimbare",direct:"direct",wait:"așteptare",
      trip:"Traseul tău",stops:"stații",back:"Înapoi",walkm:"pe jos",
      fastest:"cel mai rapid",least:"cel mai puțin mers",ticket:"Bilet",
      fare:"Bilet 24pay, valabil 60 minute · cursă spre Arcuș",
      buy:"Deschide în 24pay",interp:"oră estimată",
      unoff:"neoficial",dark:"Întunecat",light:"Luminos",
      note:"Traseul real al celor 12 linii, din shapes.txt. Itinerariul calculat din orar.",
      disc:"Prototip · Nu este site-ul oficial Multi-Trans SA. Datele provin din orarul publicat pe multitrans.ro. Orele marcate cu asterisc sunt interpolate, neoficiale.",
      dep:"plecare",arr:"sosire",samestop:"Schimbare în aceeași stație"}
};
const t = k => T[L][k];
const nm = o => typeof o === "string" ? o : o[L === "hu" ? "hu" : "ro"];

// line chips: pick text colour by luminance, nudge the two that fail AA
const FIX = {"2":"#C23325","2D":"#C23325","9":"#C99A80"};
const chipColor = id => FIX[id] || D.colors[id] || "#555";
function textOn(hex){
  const c = [1,3,5].map(i => parseInt(hex.substr(i,2),16)/255)
    .map(v => v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055,2.4));
  const l = .2126*c[0] + .7152*c[1] + .0722*c[2];
  return (l + .05) / .05 > 4.5 ? "#232E10" : "#ffffff";
}
function lineChip(id, small){
  const bg = chipColor(id);
  return `<span class="line${small?" sm":""}" style="background:${bg};color:${textOn(bg)}">${id}</span>`;
}
const WALKSVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
  stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="3.6" r="2.1" fill="currentColor" stroke="none"/>
  <path d="M13 7.6 9.4 9.9 8 14"/><path d="M13 7.6l2.9 1.5L18 12.6"/>
  <path d="M13 7.6 11.4 14l-2.7 6.3"/><path d="M11.4 14l3 2.1.9 4.2"/></svg>`;
const walkTag = m => `<span class="walkicon">${WALKSVG}${m}</span>`;

/* ---------- results ---------- */
const cost = j => j.total + j.walkMin * (0.3 + pref * 2.2);
function ranked(){
  const c = D.journeys.map((j,i) => ({j,i}));
  c.sort((a,b) => cost(a.j) - cost(b.j) || a.j.total - b.j.total);
  return c;
}
function drawList(){
  const order = ranked();
  const fastest = D.journeys.reduce((a,b) => b.total < a.total ? b : a);
  const least = D.journeys.reduce((a,b) => b.walkMin < a.walkMin ? b : a);
  document.getElementById("list").innerHTML = order.map(({j,i}) => {
    const rides = j.legs.filter(l => l.k === "ride");
    const modes = j.legs.filter(l => l.k === "ride" || l.m > 0)
      .map(l => l.k === "ride" ? lineChip(l.line) : walkTag(l.min))
      .join('<span class="dot"></span>');
    const tags = [];
    if (j === fastest) tags.push(`<span class="tag hi">${t("fastest")}</span>`);
    if (j === least && j !== fastest) tags.push(`<span class="tag">${t("least")}</span>`);
    if (rides.length > 1) tags.push(`<span class="tag">${rides.length-1} ${t("change")}</span>`);
    else tags.push(`<span class="tag">${t("direct")}</span>`);
    return `<button class="result" data-i="${i}" aria-current="${i===chosen}">
      <div class="r-top">
        <div class="r-modes">${modes}</div>
        <div class="r-dur"><b>${j.total}</b><span>${t("min")}</span></div>
      </div>
      <div class="r-bot"><b>${j.dep} → ${j.arr}</b><span class="dot"></span>
        <span>${j.tickets} × ${j.price.toFixed(1).replace(".",",").replace(",0","")} lej</span></div>
      <div class="r-tags">${tags.join("")}</div>
    </button>`;
  }).join("");
  document.querySelectorAll(".result").forEach(b =>
    b.onclick = () => openDetail(+b.dataset.i));
}

/* ---------- detail ---------- */
function openDetail(i){
  chosen = i;
  const j = D.journeys[i];
  const el = document.getElementById("detail");
  let html = `<div class="dhead"><button id="back" aria-label="${t("back")}"
      style="font-size:22px;line-height:1;width:26px">‹</button><b>${t("trip")}</b></div>
    <div class="dsum">
      <div class="r-modes">${j.legs.filter(l => l.k === "ride" || l.m > 0)
        .map(l => l.k === "ride" ? lineChip(l.line) : walkTag(l.min))
        .join('<span class="dot"></span>')}</div>
      <div class="r-dur"><b>${j.total}</b><span>${t("min")}</span></div>
    </div><div class="tl">`;

  const first = j.legs.find(l => l.k === "ride");
  html += node({pip:chipColor(first.line), bar:chipColor(first.line),
    name:nm(D.from), sub:t("dep"), time:j.dep});

  j.legs.forEach((l,k) => {
    if (l.k === "ride"){
      const col = chipColor(l.line), mid = l.stops.slice(1,-1), end = l.stops[l.stops.length-1];
      let body = `<div class="ride-head">${lineChip(l.line,true)}
        <span class="n-sub" style="margin:0">→ ${nm(l.head)}</span></div>`;
      if (mid.length) body += `<details class="between"><summary>${mid.length} ${t("stops")} ⌄</summary>
        <ol>${mid.map(s => `<li>${nm({hu:s.h,ro:s.n})} <b>${s.t}${s.tp?"":"*"}</b></li>`).join("")}</ol></details>`;
      html += `<div class="node" style="--bar:${col};--pip:${col}">
        <div class="rail-c"><span class="pip" style="--pip:${col}"></span></div>
        <div class="n-body">${body}</div><div class="n-time"></div></div>`;
      if (j.legs[k+1])
        html += node({pip:col, bar:"transparent",
          name: nm({hu:end.h, ro:end.n}), sub:"", time:end.t, soft:!end.tp});
    } else {
      const same = l.m === 0;
      html += `<div class="node walk"><div class="rail-c"><span class="pip"
          style="--pip:var(--ink-2);width:9px;height:9px;border-width:2.5px"></span></div>
        <div class="n-body"><div class="walkbox">${same ? "" : WALKSVG}
          <span>${same ? t("samestop") : `${l.m} m · ${l.min} ${t("min")} ${t("walkm")}`}</span></div>
          <div class="n-sub">${nm(l.to)}${j.wait ? ` · ${j.wait} ${t("min")} ${t("wait")}` : ""}</div>
        </div><div class="n-time soft"></div></div>`;
    }
  });
  const last = j.legs.filter(l => l.k === "ride").pop();
  const fin = last.stops[last.stops.length - 1];
  html += node({pip:"var(--ink)", bar:"transparent", name:nm(D.to), sub:t("arr"),
    time:j.arr, flag:true, soft:!fin.tp});
  html += `</div>
    <div class="fare">
      <div class="fare-row"><span>${t("ticket")}</span>
        <b>${j.tickets} × ${j.price.toFixed(1).replace(".",",").replace(",0","")} lej</b></div>
      <small>${t("fare")}</small>
      <button class="cta">${t("buy")}</button>
    </div>`;
  el.innerHTML = html;
  el.hidden = false;
  document.getElementById("list").hidden = true;
  document.getElementById("controls").style.display = "none";
  document.getElementById("back").onclick = closeDetail;
  document.getElementById("scroll").scrollTop = 0;
  drawTrip(j);
}
function node({pip,bar,name,sub,time,flag,soft}){
  return `<div class="node" style="--bar:${bar}">
    <div class="rail-c"><span class="pip${flag?" flag":""}" style="--pip:${pip}"></span></div>
    <div class="n-body"><div class="n-name">${name}</div>
      ${sub?`<div class="n-sub">${sub}</div>`:""}</div>
    <div class="n-time${soft?" soft":""}">${time}${soft?"*":""}</div></div>`;
}
function closeDetail(){
  document.getElementById("detail").hidden = true;
  document.getElementById("list").hidden = false;
  document.getElementById("controls").style.display = "";
  drawList(); drawTrip(D.journeys[chosen]);
}

/* ---------- map ---------- */
const SVG = document.getElementById("svg");
function setView(x0,y0,w,h){
  const MIN = 1400;                       // never zoom past ~1.4 km across
  if (w < MIN){ x0 -= (MIN-w)/2; w = MIN; }
  if (h < MIN){ y0 -= (MIN-h)/2; h = MIN; }
  const pad = Math.max(w,h) * 0.12;
  x0 -= pad; y0 -= pad; w += pad*2; h += pad*2;
  const box = SVG.getBoundingClientRect();
  const ar = (box.width || 1000) / (box.height || 800);
  if (w/h < ar){ const nw = h*ar; x0 -= (nw-w)/2; w = nw; }
  else { const nh = w/ar; y0 -= (nh-h)/2; h = nh; }
  view = [x0, y0, w, h];
  SVG.setAttribute("viewBox", view.join(" "));
  const s = view[2] / 900;
  document.getElementById("net").style.strokeWidth = (s*11)+"px";
  document.getElementById("trip").style.setProperty("--tw",(s*26)+"px");
  document.getElementById("stopdots").style.setProperty("--r",(s*7)+"px");
  SVG.querySelectorAll("#trip path").forEach(p => {
    const w0 = p.dataset.role === "case" ? s*40 : p.dataset.role === "walk" ? s*17 : s*26;
    p.setAttribute("stroke-width", w0);
    if (p.dataset.role === "walk") p.setAttribute("stroke-dasharray", `${s*4} ${s*22}`);
  });
  SVG.querySelectorAll("#marks circle").forEach(c => c.setAttribute("r", s*17));
  SVG.querySelectorAll("#stopdots circle").forEach(c => c.setAttribute("r", s*5));
}
const d2 = pts => "M" + pts.map(p => p.join(" ")).join("L");
function drawNet(){
  document.getElementById("net").innerHTML =
    Object.values(D.net).map(p => `<path d="${d2(p)}"/>`).join("");
  document.getElementById("stopdots").innerHTML =
    D.stops.map(s => `<circle class="stopdot" cx="${s.x}" cy="${s.y}" r="5" stroke-width="2"/>`).join("");
}
function drawTrip(j){
  const paths = [], marks = [];
  j.legs.forEach(l => {
    if (l.k === "ride"){
      paths.push(`<path data-role="case" d="${d2(l.path)}" stroke="var(--map-case)"/>`);
      paths.push(`<path data-role="ride" d="${d2(l.path)}" stroke="${chipColor(l.line)}"/>`);
      l.stops.forEach(s => marks.push(
        `<circle cx="${s.x}" cy="${s.y}" r="14" fill="var(--map-case)"
                 stroke="${chipColor(l.line)}" stroke-width="6"/>`));
    } else if (l.m > 0) {
      paths.push(`<path data-role="walk" d="${d2(l.path)}" stroke="var(--ink)"
        stroke-linecap="round" opacity=".75"/>`);
    }
  });
  document.getElementById("trip").innerHTML = paths.join("");
  document.getElementById("marks").innerHTML = marks.join("");
  const all = j.legs.flatMap(l => l.path);
  const xs = all.map(p => p[0]), ys = all.map(p => p[1]);
  setView(Math.min(...xs), Math.min(...ys),
          Math.max(...xs)-Math.min(...xs), Math.max(...ys)-Math.min(...ys));
}
document.getElementById("zin").onclick = () => zoom(0.75);
document.getElementById("zout").onclick = () => zoom(1/0.75);
function zoom(f){
  const [x,y,w,h] = view, cx = x+w/2, cy = y+h/2;
  setView(cx-w*f/2, cy-h*f/2, w*f, h*f);
}

/* ---------- search suggestions ---------- */
const ALIAS = [
  {q:"söröző",     ro:"Str. Sporturilor", hu:"Sport utca",        why:"helyi név"},
  {q:"anl",        ro:"Str. Lăcrămioarei 1", hu:"Gyöngyvirág utca 1", why:"helyi név"},
  {q:"sepsi value center", ro:"Centru Comercial", hu:"Bevásárlóközpont", why:"üzletközpont"},
  {q:"kórház",     ro:"Spitalul Județean", hu:"Megyei Kórház",    why:"helyi név"},
  {q:"állomás",    ro:"Gara CFR",          hu:"Vasútállomás",     why:"helyi név"}
];
const fold = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
function suggest(input, box){
  const v = fold(input.value.trim());
  if (!v){ box.hidden = true; return; }
  const seen = new Set(), out = [];
  ALIAS.forEach(a => { if (fold(a.q).includes(v) || v.includes(fold(a.q))){
    out.push({n:L==="hu"?a.hu:a.ro, s:a.why, alias:a.q, ic:"◎"}); seen.add(a.hu); }});
  D.stops.forEach(s => {
    const label = L === "hu" ? s.h : s.n;
    if (seen.has(label) || out.length > 7) return;
    if (fold(label).includes(v)){ seen.add(label);
      out.push({n:label, s:(L==="hu"?s.n:s.h) + (s.z==="arcus"?" · Árkos":""), ic:"⬤"}); }
  });
  box.innerHTML = out.length ? out.map(o => `<button>
      <span class="sg-ic">${o.ic}</span>
      <span class="sg-t"><span class="sg-n">${o.n}</span><span class="sg-s">${o.s}</span></span>
      ${o.alias ? `<span class="sg-alias">${o.alias}</span>` : ""}</button>`).join("")
    : `<button><span class="sg-ic">·</span><span class="sg-t"><span class="sg-n">—</span></span></button>`;
  box.hidden = false;
  box.querySelectorAll("button").forEach((b,k) => b.onclick = () => {
    input.value = out[k] ? out[k].n : ""; box.hidden = true;
  });
}
["from","to"].forEach(id => {
  const inp = document.getElementById("i-"+id), box = document.getElementById("sugg");
  inp.addEventListener("input", () => suggest(inp, box));
  inp.addEventListener("focus", () => suggest(inp, box));
  inp.addEventListener("blur", () => setTimeout(() => box.hidden = true, 180));
});
document.getElementById("swap").onclick = () => {
  const a = document.getElementById("i-from"), b = document.getElementById("i-to");
  [a.value, b.value] = [b.value, a.value];
};

};
