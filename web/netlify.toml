# Netlify applies the repository configuration's `base = "web"` before it
# resolves this file. Keep the production build settings here as well: without
# them it uploads the source folder, which has no index.html, instead of out/.
[build]
  command = "npm run build"
  publish = "out"

[dev]
  command = "npm run dev:https:next"
  targetPort = 3000
  port = 8888
  autoLaunch = false

  [dev.https]
    certFile = "certificates/dev.pem"
    keyFile = "certificates/dev-key.pem"

# Old path shapes kept alive with a 301 so external links and search results
# survive the rename: `/hu/*` was the Hungarian prefix before it moved to the
# bare root, and `/lines` `/stops` were the English segment names.
[[redirects]]
  from = "/hu/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/lines/*"
  to = "/vonalak/:splat"
  status = 301

[[redirects]]
  from = "/stops/*"
  to = "/megallok/:splat"
  status = 301

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=()"
