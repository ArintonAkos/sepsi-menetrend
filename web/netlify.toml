# This file exists only for `npm run dev:https` from web/. Netlify deployment
# reads the repository-root netlify.toml; local development must instead use
# web/ as its project root so the Edge Function is found in netlify/edge-functions.
[dev]
  command = "npm run dev:https:next"
  targetPort = 3000
  port = 8888
  autoLaunch = false

  [dev.https]
    certFile = "certificates/dev.pem"
    keyFile = "certificates/dev-key.pem"
